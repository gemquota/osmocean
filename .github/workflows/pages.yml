name: Publish integration lab to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Osmocean
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Checkout pinned Ultra-Water source
        uses: actions/checkout@v4
        with:
          repository: Humpalumps/Ultra-Water
          ref: 30ea65ecb0a66b137aa200d099965634bdd84d51
          path: _upstream/ultra-water
          persist-credentials: false
      - name: Checkout pinned fluid solver source
        uses: actions/checkout@v4
        with:
          repository: jeantimex/fluid
          ref: 9daf3ae2add7dedc3eadcc10da5e4a44ef1b771f
          path: _upstream/fluid
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: _upstream/ultra-water/package-lock.json
      - name: Apply Osmocean Rapier integration
        run: |
          node scripts/integrate-ultra-water-rapier.mjs _upstream/ultra-water _upstream/fluid
      - name: Install and build Ultra-Water
        working-directory: _upstream/ultra-water
        run: |
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          npm ci
          npm run build -- --base=/osmocean/ultra-water/
          cp LICENSE dist/LICENSE
          cp THIRD_PARTY_NOTICES.md dist/THIRD_PARTY_NOTICES.md
      - name: Set up Node.js cache for fluid solver
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: _upstream/fluid/package-lock.json
      - name: Apply Osmocean SPH/Rapier integration
        run: node scripts/integrate-fluid-rapier.mjs _upstream/fluid
      - name: Build integrated fluid solver
        working-directory: _upstream/fluid
        run: |
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          npm ci
          npm run build -- --base=/osmocean/fluid/
          cp LICENSE.txt dist/LICENSE.txt
      - name: Assemble static site
        run: |
          mkdir -p _site/docs _site/ultra-water _site/fluid
          cp index.html lab.html styles.css lab.css app.js lab.js _site/
          cp -R docs/. _site/docs/
          cp -R _upstream/ultra-water/dist/. _site/ultra-water/
          cp -R _upstream/fluid/dist/. _site/fluid/
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
