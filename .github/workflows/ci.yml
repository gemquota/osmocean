name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test

  ultra-water-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Osmocean
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Checkout pinned Ultra-Water source
        uses: actions/checkout@v4
        with:
          repository: Humpalumps/Ultra-Water
          ref: 30ea65ecb0a66b137aa200d099965634bdd84d51
          path: _upstream/ultra-water
          persist-credentials: false
      - name: Checkout pinned SPH solver source
        uses: actions/checkout@v4
        with:
          repository: jeantimex/fluid
          ref: 9daf3ae2add7dedc3eadcc10da5e4a44ef1b771f
          path: _upstream/fluid
          persist-credentials: false
      - name: Checkout pinned PolyFish model
        uses: actions/checkout@v4
        with:
          repository: unclemattmakes/polyfish
          ref: 1c0d7636f2c71fd81d001a597c13554f9cbdd417
          path: _upstream/polyfish
          sparse-checkout: |
            assets/models/fish_rigged.glb
            LICENSE
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - name: Checkout pinned Quaternius CC0 fish models
        uses: actions/checkout@v4
        with:
          repository: Vitexus/ishtaria-client
          ref: f42095c120c29a892c0c221bdc8357ac982ccfca
          path: _upstream/fish-assets
          sparse-checkout: |
            assets/quaternius/animated-fish-bundle/Models
            assets/quaternius/animated-fish-bundle/License.txt
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: _upstream/ultra-water/package-lock.json
      - name: Download CC0 reef rock formations from Poly Haven
        run: node scripts/download-reef-assets.mjs _upstream/ultra-water/public/models/osmocean/reef
      - name: Download verified CC0 ocean fauna models
        run: node scripts/download-ocean-fauna.mjs _downloaded/ocean-fauna
      - name: Apply Osmocean Rapier integration
        run: node scripts/integrate-ultra-water-rapier.mjs _upstream/ultra-water _upstream/fluid _upstream/polyfish _upstream/fish-assets
      - name: Install dependencies
        working-directory: _upstream/ultra-water
        run: |
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          npm ci
      - name: Build upstream demo for GitHub Pages
        working-directory: _upstream/ultra-water
        run: npm run build -- --base=/osmocean/ultra-water/

  fluid-rapier-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Osmocean
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Checkout pinned fluid solver
        uses: actions/checkout@v4
        with:
          repository: jeantimex/fluid
          ref: 9daf3ae2add7dedc3eadcc10da5e4a44ef1b771f
          path: _upstream/fluid
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: _upstream/fluid/package-lock.json
      - name: Inject Osmocean SPH/Rapier demo
        run: node scripts/integrate-fluid-rapier.mjs _upstream/fluid
      - name: Install and build integrated fluid demo
        working-directory: _upstream/fluid
        run: |
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          npm ci
          npm run build -- --base=/osmocean/fluid/
